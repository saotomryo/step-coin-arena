<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ステップコイン・アリーナ 競技環境</title>
<style>
body{background:#edf1f5;color:#203044;font:16px system-ui,sans-serif;margin:0}main{max-width:1180px;margin:24px auto;padding:0 20px}h1{margin:0;font-size:25px}p{color:#66758a}header,.cards,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.badge{background:#e2e8f0;border-radius:20px;padding:6px 16px}.cards{margin:20px 0}.card{background:white;border-radius:14px;padding:18px 24px;flex:1;min-width:150px}.number{font-size:36px;font-weight:700}.controls{margin-bottom:20px}button{border:0;background:#244c82;color:white;padding:11px 18px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.35;cursor:default}.secondary{background:#64748b}.danger{background:#a33f47}.layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{background:white;padding:18px;border-radius:14px}svg{width:100%;max-height:650px}.events{max-height:520px;overflow:auto;font-size:14px}.event{padding:10px 0;border-bottom:1px solid #edf1f5}#error{color:#a33f47;min-height:24px}small{color:#66758a}.legend{display:flex;gap:20px;font-size:13px}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style><main><header><h1>ステップコイン・アリーナ 競技環境</h1><span class="badge" id="status">準備中</span><span id="round"></span></header><p>競技の操作と状態確認。Genesisの3D画面は別ウィンドウに表示します。</p>
<section class="cards"><div class="card">残り競技時間<div class="number" id="clock">—</div><small>シミュレーション時間</small></div><div class="card" style="border-top:4px solid #287dc0">青<div class="number" id="self">0</div><small id="selfCount"></small></div><div class="card" style="border-top:4px solid #cf5158">赤<div class="number" id="opponent">0</div><small id="opponentCount"></small></div></section>
<section class="controls"><button data-action="start">競技開始</button><button data-action="pause">一時停止</button><button data-action="resume">再開</button><button class="secondary" data-action="stop">競技を終了</button><button class="secondary" data-action="reset">初期状態へ戻す</button><button class="danger" data-action="shutdown">環境を終了</button></section><div id="error"></div>
<div class="layout"><section class="panel"><div class="legend"><span>🟡 出現中のコイン</span><span style="color:#287dc0">● 青</span><span style="color:#cf5158">● 赤</span></div><svg id="field" viewBox="-7.5 -7.5 15 15" aria-label="競技場の上面図"></svg><small id="coins"></small><p><label><input type="checkbox" id="spots">出現場所の目印を表示</label></p><small id="rules"></small></section><section class="panel"><h3>競技イベント</h3><div class="events" id="events"></div></section></div></main>
<script>
const token='__TOKEN__',names={self:'青',opponent:'赤'},labels={ready:'待機中',running:'競技中',paused:'一時停止',finished:'競技終了',preparing:'準備中',error:'停止（エラー）'};
const el=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;
function draw(s){el('status').textContent=labels[s.control_status]||s.control_status;el('round').textContent=s.round_id?'第'+s.round_id+'試合':'';el('clock').textContent=s.remaining?.toFixed(1)+' 秒';el('error').textContent=s.error||'';
for(const p of ['self','opponent']){el(p).textContent=s.scores?.[p]??0;el(p+'Count').textContent=(s.collection_counts?.[p]??0)+'回取得'}
const allowed={start:['ready','finished'],pause:['running'],resume:['paused'],stop:['running','paused'],reset:['ready','running','paused','finished','error'],shutdown:['ready','running','paused','finished','error']};document.querySelectorAll('[data-action]').forEach(b=>b.disabled=!allowed[b.dataset.action].includes(s.control_status));
let svg='<circle cx="0" cy="0" r="6.875" fill="#fafbfd" stroke="#94a3b8" stroke-width=".04"/>';
for(const t of [...(s.field||[])].reverse())svg+=`<circle cx="0" cy="0" r="${t.radius}" fill="${t.height>.5?'#e7eddf':t.height>.2?'#e7edf8':'#f8eceb'}" stroke="#9da9b8" stroke-width=".025"/>`;
for(const c of s.coins||[]){let [x,y]=c.pos;if(el('spots').checked)svg+=`<circle cx="${x}" cy="${-y}" r=".18" fill="none" stroke="#a7b0bc" stroke-width=".025"/>`;if(c.status==='available')svg+=`<circle cx="${x}" cy="${-y}" r=".15" fill="#f1b536" stroke="#b17b12" stroke-width=".02"/><text x="${x+.2}" y="${-y}" font-size=".2">${escape(c.id)}</text>`}
for(const [p,pos] of Object.entries(s.positions||{})){svg+=`<circle cx="${pos[0]}" cy="${-pos[1]}" r=".3" fill="${p==='self'?'#287dc0':'#cf5158'}" opacity=".85"/><text x="${pos[0]}" y="${-pos[1]-.45}" text-anchor="middle" font-size=".24">${escape(names[p]||p)}</text>`}el('field').innerHTML=svg;
const counts={available:0,pending:0,collected:0};for(const c of s.coins||[])counts[c.status]++;el('coins').textContent=`出現中 ${counts.available} / 未出現 ${counts.pending} / 取得済み ${counts.collected}　接触候補 ${s.robot_contact_steps??0} ステップ`;el('rules').textContent=s.rules_note||'';
el('events').innerHTML=[...(s.events||[])].reverse().map(e=>{const message=e.type==='coin_spawned'?`コイン ${e.coin_id} 出現（${e.generation}回目）`:e.type==='coin_collected'?`${names[e.participant]||e.participant} がコイン ${e.coin_id} を取得 +${e.points}点`:e.type==='coin_contested'?`コイン ${e.coin_id} で競合`:e.type==='competition_started'?'競技開始':e.type==='competition_finished'?'競技終了':e.type==='robot_recovered'?`${names[e.participant]||e.participant} スタート復帰（${e.blocked_seconds.toFixed(1)}秒停滞）`:e.type;return `<div class="event"><small>${e.time.toFixed(2)}秒</small> ${escape(message)}</div>`}).join('');}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':token},body:JSON.stringify({action:b.dataset.action})});if(!r.ok)el('error').textContent='操作を受け付けられませんでした';}catch{el('error').textContent='環境との接続が終了しました'}});el('spots').onchange=()=>state&&draw(state);
async function poll(){try{const r=await fetch('/state');if(!r.ok)throw Error();state=await r.json();draw(state)}catch{el('error').textContent='環境との接続が終了しました';document.querySelectorAll('button').forEach(b=>b.disabled=true)}finally{setTimeout(poll,250)}}poll();
</script></html>
